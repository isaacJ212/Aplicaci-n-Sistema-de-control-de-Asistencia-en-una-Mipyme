<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Nómina — MipymeAsistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <link rel="stylesheet" href="../../assets/css/empleado.css" />
  <link rel="stylesheet" href="../../assets/css/empleado-pages.css" />
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-container"></div>
  <main class="main-content">
    <header class="topbar">
      <span class="topbar-title">Mi Recibo de Pago</span>
      <div class="topbar-right">
        <span class="topbar-badge" id="badge-periodo">—</span>
      </div>
    </header>

    <section class="page-content">
      <div class="page-header">
        <div class="page-header-text">
          <h1>Mi Nómina</h1>
          <p>Consulta el desglose completo de tu salario, deducciones y prestaciones sociales.</p>
        </div>
        <div class="page-header-actions">
          <div class="form-group form-group-compact">
            <label class="form-label">Período</label>
            <input type="month" class="form-input input-min-160" id="sel-periodo" />
          </div>
          <button class="btn btn-secondary" id="btn-buscar">Consultar</button>
        </div>
      </div>

      <div id="contenido">
        <div class="empty-placeholder">
          <div class="empty-icon">💵</div>
          <h3 class="mb-2">Selecciona un período</h3>
          <p>Elige el mes que deseas consultar y haz clic en "Consultar".</p>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toast-container"></div>
<script type="module">
import { initEmpleadoLayout }        from '../../modules/layout.js';
import { authApi, planillaApi,
         empleadoApi }                from '../../modules/api.js';
import { toast, formatDate,
         formatCurrency }             from '../../modules/utils.js';

await initEmpleadoLayout('nomina');

let idEmpleado = null;
let nombreEmpleado = '';

async function init() {
  const me = await authApi.me();
  idEmpleado = me.idEmpleado ?? null;
  if (!idEmpleado) { toast('No tienes expediente de empleado.','warning'); return; }
  try {
    const emp = await empleadoApi.getById(idEmpleado);
    nombreEmpleado = `${emp.nombres} ${emp.apellidos}`;
  } catch { nombreEmpleado = me.email; }
  // default: mes actual
  const hoy = new Date();
  document.getElementById('sel-periodo').value =
    `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
}

async function buscar() {
  const periodo = document.getElementById('sel-periodo').value;
  if (!periodo) { toast('Selecciona un período.','warning'); return; }

  document.getElementById('badge-periodo').textContent = periodo;
  document.getElementById('contenido').innerHTML =
    `<div class="empty-placeholder-small"><div class="empty-icon">⏳</div><p>Cargando...</p></div>`;

  try {
    const data = await planillaApi.getByEmpleado(idEmpleado, periodo);
    const lista = Array.isArray(data) ? data : [];

    if (!lista.length) {
      document.getElementById('contenido').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h3>Sin planilla para este período</h3>
          <p>No se ha generado la planilla de <strong>${periodo}</strong>. Contacta al administrador.</p>
        </div>`;
      return;
    }

    const p = lista[0];
    document.getElementById('contenido').innerHTML = `
      <div class="recibo">
        <div class="recibo-header">
          <div>
            <div class="recibo-empresa">🏢 MipymeAsistencia</div>
            <div class="recibo-periodo">Recibo de pago — Período ${p.periodoMesAnio}</div>
            <div class="recibo-meta">Emitido: ${formatDate(p.fechaEmision)}</div>
          </div>
          <div class="recibo-empleado">
            <div class="recibo-nombre">${p.nombreEmpleado || nombreEmpleado}</div>
            <div class="recibo-cargo">${p.cargoEmpleado || '—'}</div>
          </div>
        </div>

        <div class="recibo-body">
          <div class="recibo-grid-2">
            <div>
              <div class="recibo-section-title">📈 Ingresos</div>
              <div class="recibo-fila"><span class="label">Salario básico</span><span class="valor">${formatCurrency(p.salarioBase)}</span></div>
              <div class="recibo-fila"><span class="label">Comisiones</span><span class="valor">${formatCurrency(p.comisiones)}</span></div>
              <div class="recibo-fila"><span class="label">Horas extras (${p.totalHorasExtras}h)</span><span class="valor">${formatCurrency(p.pagoHorasExtras)}</span></div>
              <div class="recibo-fila"><span class="label">Incentivos</span><span class="valor">${formatCurrency(p.incentivos)}</span></div>
              <div class="recibo-fila recibo-row-top-border">
                <span class="label font-medium">Total ingresos</span>
                <span class="valor font-medium">${formatCurrency(p.totalIngresos)}</span>
              </div>
            </div>

            <div>
              <div class="recibo-section-title">📉 Deducciones laborales</div>
              <div class="recibo-fila"><span class="label">INSS Laboral (7%)</span><span class="valor danger">- ${formatCurrency(p.inssLaboral)}</span></div>
              <div class="recibo-fila"><span class="label">IR (Ley 822 LCT)</span><span class="valor danger">- ${formatCurrency(p.irLaboral)}</span></div>
              <div class="recibo-fila"><span class="label">Embargo</span><span class="valor danger">- ${formatCurrency(p.embargo)}</span></div>
              <div class="recibo-fila"><span class="label">Sindicato</span><span class="valor danger">- ${formatCurrency(p.sindicato)}</span></div>
              <div class="recibo-fila"><span class="label">Otras deducciones</span><span class="valor danger">- ${formatCurrency(p.otrasDeducciones)}</span></div>
              <div class="recibo-fila recibo-row-top-border">
                <span class="label font-medium">Total deducciones</span>
                <span class="valor danger font-medium">- ${formatCurrency(p.totalDeducciones)}</span>
              </div>
            </div>
          </div>

          <div class="recibo-neto">
            <span class="recibo-neto-label">💰 NETO A PAGAR</span>
            <span class="recibo-neto-valor">${formatCurrency(p.salarioNeto)}</span>
          </div>

          <div class="mt-5">
            <div class="recibo-section-title">🏦 Aportes patronales (informativo — cargo a la empresa)</div>
            <div class="recibo-grid-2">
              <div class="recibo-fila"><span class="label">INSS Patronal (21.5%)</span><span class="valor">${formatCurrency(p.inssPatronal)}</span></div>
              <div class="recibo-fila"><span class="label">INATEC (2%)</span><span class="valor">${formatCurrency(p.inatec)}</span></div>
            </div>
          </div>

          <div class="mt-5">
            <div class="recibo-section-title">📆 Provisión de prestaciones sociales (mensual)</div>
            <div class="recibo-grid-3">
              <div class="recibo-fila recibo-fila-column">
                <span class="label">Vacaciones</span><span class="valor">${formatCurrency(p.acumuladoVacaciones)}</span>
              </div>
              <div class="recibo-fila recibo-fila-column">
                <span class="label">Aguinaldo</span><span class="valor">${formatCurrency(p.acumuladoAguinaldo)}</span>
              </div>
              <div class="recibo-fila recibo-fila-column">
                <span class="label">Indemnización</span><span class="valor">${formatCurrency(p.acumuladoIndemnizacion)}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Historial de todos los períodos -->
      <div class="card card-no-padding mt-5">
        <div class="card-section">
          <span class="card-title">Historial completo de nómina</span>
        </div>
        <div id="historial-tabla"></div>
      </div>
    `;

    // Cargar historial completo
    const todos = await planillaApi.getByEmpleado(idEmpleado);
    const hist = Array.isArray(todos) ? todos : [];
    document.getElementById('historial-tabla').innerHTML = hist.length
      ? `<div class="table-wrapper table-wrapper-no-border">
          <table class="data-table">
            <thead><tr><th>Período</th><th>Salario base</th><th>HH. Extras</th><th>Total ingresos</th><th>Deducciones</th><th class="text-accent">Neto</th></tr></thead>
            <tbody>${hist.map(r => `
              <tr>
                <td class="font-medium">${r.periodoMesAnio}</td>
                <td>${formatCurrency(r.salarioBase)}</td>
                <td>${formatCurrency(r.pagoHorasExtras)}</td>
                <td>${formatCurrency(r.totalIngresos)}</td>
                <td class="text-danger">- ${formatCurrency(r.totalDeducciones)}</td>
                <td class="font-medium text-accent">${formatCurrency(r.salarioNeto)}</td>
              </tr>`).join('')}</tbody>
          </table></div>`
      : `<div class="empty-state empty-state-compact"><p>Sin planillas históricas.</p></div>`;

  } catch (err) {
    toast(err.message,'error');
    document.getElementById('contenido').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>${err.message}</h3></div>`;
  }
}

document.getElementById('btn-buscar').addEventListener('click', buscar);
document.getElementById('sel-periodo').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});

await init();
</script>
</body>
</html>
