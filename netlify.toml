# ============================================================
#  Netlify — MipymeAsistencia Frontend
# ============================================================

[build]
  # Carpeta que Netlify publica como raíz del sitio
  publish = "frontend"

  # Sin comando de build — es HTML/CSS/JS puro, no necesita compilación
  command = ""

# ── Redirects ────────────────────────────────────────────────
# Netlify sirve frontend/ como /  →  todas las rutas del HTML son correctas
# SPA fallback: si alguien entra directo a una URL, sirve el index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de seguridad ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Permite llamadas al backend en Render desde Netlify
    Access-Control-Allow-Origin = "*"

# Caché agresivo para assets estáticos (CSS/JS/imágenes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
